[project]
name = "leakage-proof-timeseries"
version = "0.1.0"
description = "Leakage-proof validation on time-ordered synthetic data: research foundations, naive pipeline audit, and the three-audit walkthrough. Synthetic portfolio starting point, not production experience."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "torch",
    "jupyter",
    "nbconvert",
    "nbformat",
    "ipykernel",
    "pytest",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
